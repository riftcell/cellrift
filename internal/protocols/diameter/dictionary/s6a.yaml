# 3GPP TS 29.272 (S6a/S6d interface) AVP dictionary.
# AVP code/name/type/flag data transcribed from the public 3GPP TS 29.272
# specification for product-design purposes (3GPP terms of use). No text or
# structure copied from any third-party dictionary implementation.
#
# Every entry below is spec-only unless noted: its code/name/type were
# transcribed directly from TS 29.272 V13.6.0 Table 7.3.1/1 and the
# per-AVP "AVP format" clauses in clause 7.3. go-diameter's
# diam/dict/testdata/tgpp_s6a.xml (BSD-3-Clause) was consulted only as an
# independent cross-check on name/code/type for the ~109 elements it
# happens to cover, never as the source of the data itself.
#
# Grouped members that the source AVP format lists but that are reused from
# a different specification (e.g. Service-Selection, MIP6-Agent-Info,
# 3GPP-Charging-Characteristics, MSISDN, ProSe-Subscription-Data) are omitted
# per the transcription contract rather than declared a second time; each
# omission is called out on the entry that would otherwise carry it.
# Confidentiality-Key, Integrity-Key and Visited-Network-Identifier are the
# exception: they are 3GPP TS 29.229 (Cx) AVPs, declared in cx.yaml and
# referenced by name below from UTRAN-Vector, APN-Configuration,
# Specific-APN-Info and Active-APN. Grouped members that TS 29.272 does
# define, but that land in a later chunk of this same phase, are still
# listed by name (forward reference) -- that is the expected, provisional
# shape until the self-consistency gate runs unfiltered.
#
# Chunk 1: table start (Subscription-Data, 1400) through APN-Configuration-
# Profile (1429) -- 30 entries, TS 29.272 V13.6.0 Table 7.3.1/1 order: the
# table is printed in AVP-code order, not alphabetical, contrary to an
# earlier chunk-boundary guess made before the table itself was read row by
# row.
application: S6a
spec: "3GPP TS 29.272"
avps:
