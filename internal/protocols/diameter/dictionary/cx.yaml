      - { name: SIP-Authentication-Scheme, required: false, max: 1 }
      - { name: SIP-Authenticate, required: false, max: 1 }
      - { name: SIP-Authorization, required: false, max: 1 }
      - { name: SIP-Authentication-Context, required: false, max: 1 }
      - { name: Confidentiality-Key, required: false, max: 1 }
      - { name: Integrity-Key, required: false, max: 1 }
      - { name: SIP-Digest-Authenticate, required: false, max: 1 } # code 635, defined later in this same file
      # Framed-IP-Address, Framed-IPv6-Prefix and Framed-Interface-Id omitted:
      # reused from IETF RFC 4005, outside this file's TS 29.229 600-655 range.
      # Line-Identifier omitted: ETSI vendor 13019 (not 3GPP 10415), code 500,
      # outside this file's range.

