# 3GPP TS 29.229 (Cx/Dx interface) AVP dictionary.
# AVP code/name/type/flag data transcribed from the public 3GPP TS 29.229
# specification for product-design purposes (3GPP terms of use). No text or
# structure copied from any third-party dictionary implementation.
#
# Source: 3GPP TS 29.229 V13.0.0 (2015-12), Table 6.3.1 ("Diameter Multimedia
# Application AVPs") and the per-AVP clauses 6.3.1-6.3.67. Every entry's
# code/name/type/flags below was transcribed directly from that table and its
# clauses. Table 6.3.1's own header states: "The Vendor-ID header of all AVPs
# defined in this specification shall be set to 3GPP (10415) if not otherwise
# indicated" -- hence every entry here carries vendor-id 10415.
#
# This file covers codes 600-655 (54 entries; codes 627 and 636 are unused in
# the table itself, not a transcription omission). Codes 656-658
# (Allowed-WAF-WWSF-Identities, WebRTC-Authentication-Function-Name,
# WebRTC-Web-Server-Function-Name) are real Rel-13 assignments in the same
# table, deliberately left out because this file tracks the 600-655 range --
# a floor, not a ceiling.
application: Cx
spec: "3GPP TS 29.229"
avps:
  # 3GPP TS 29.229 §6.3.1
  - name: Visited-Network-Identifier
    code: 600
    vendor-id: 10415
    type: OctetString
    flags: { mandatory: true, vendor: true }

