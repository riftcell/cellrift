; pjsip.conf — the interop SIP peer's own configuration, mounted read-only
; over the image's sample at /etc/asterisk/pjsip.conf.
;
; chan_sip was removed in Asterisk 21, so this is chan_pjsip only.
;
; Ports are 15060/15061 on purpose, not 5060/5061. This container runs with
; --network host, and a developer machine frequently runs its own Asterisk on
; the default ports. When that happens the container's bind fails, Asterisk
; still logs "Asterisk Ready.", and the scenarios then run against the OTHER
; server — a green or red result about a peer nobody configured. up-sip.sh
; gates on the transport list and on the absence of a bind error for the same
; reason.
;
; Authentication is switched on for three endpoints only. The original two,
; 447700900123 and 447700900001, are unauthenticated ON PURPOSE: the three
; scenarios proven before digest support (register_impaired, basic_call,
; basic_call_tls) register against them with no credentials and must keep
; passing against this same container. The three new endpoints, 447700900201
; to 447700900203, require digest. Their [auth] objects differ ONLY in
; supported_algorithms_uas, so one credential pair drives an MD5-only, a
; SHA-256-only and a both-offered challenge.

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:15060

; method=tlsv1_2 is REQUIRED. Without it Cellrift (Go, MinVersion TLS 1.2)
; fails with "remote error: tls: protocol version not supported" and Asterisk
; logs error:0A000102 ... unsupported protocol.
;
; cert_file and priv_key_file must be SEPARATE files. A combined cert+key PEM
; in cert_file alone fails the handshake with "no shared cipher".
;
; No ca_list_file / verify_client / verify_server: this is server-only TLS.
; Mutual TLS would add ca_list_file= and verify_client=yes, and is not proven
; here.
[transport-tls]
type=transport
protocol=tls
bind=0.0.0.0:15061
cert_file=/etc/asterisk/keys/asterisk.crt
priv_key_file=/etc/asterisk/keys/asterisk.key
method=tlsv1_2

[endpoint-tmpl](!)
type=endpoint
context=from-cellrift
disallow=all
; allow=ulaw,alaw is what makes Asterisk answer the INVITE with an SDP body
; instead of 488; basic_call.yaml asserts negotiated_codec != null, and
; Cellrift captures the first a=rtpmap (PCMU).
allow=ulaw,alaw
direct_media=no
rtp_symmetric=yes

[aor-tmpl](!)
type=aor
max_contacts=5
remove_existing=yes

; Endpoint name = the From user of the request. Asterisk matches on that; the
; SIP domain in the scenarios (.lab.local / ims.local) is irrelevant and needs
; no domain_alias. A From user with no endpoint here is answered 401
; Unauthorized — which is the rejecting-peer behaviour the probe relies on.
;
; SYNTHETIC DATA: Ofcom test range (447700900xxx) only. 447700900123 is
; register_impaired.yaml's subscriber; 447700900001 is basic_call.yaml's
; caller. No endpoint is needed for the callee (447700900002): the dialplan
; context comes from the calling endpoint. 447700900201, 447700900202 and
; 447700900203 belong to register_digest_auth.yaml (MD5-only, SHA-256-only and
; both-offered respectively).
[447700900123](endpoint-tmpl)
aors=447700900123

[447700900123](aor-tmpl)

[447700900001](endpoint-tmpl)
aors=447700900001

[447700900001](aor-tmpl)

; Digest authentication. The three objects share one username and password and
; differ only in the algorithms the peer is willing to challenge with. The
; digest username (impi-user) is deliberately NOT the From user: it is
; independent of it, which is the IMS IMPI/IMPU shape. shared-pw is a synthetic
; lab value, not a secret.
;
; supported_algorithms_uas needs Asterisk 20.12 / 21.7 / 22.2 or later, and
; SHA-256 needs a pjproject newer than 2.14.1; the pinned 22.10.1 image has
; both. With SHA-256,MD5 the peer sends TWO WWW-Authenticate headers, most
; preferred first, each with its own opaque and the same nonce.
;
; This peer checks the digest ARITHMETIC (it returns 401 when the hash is
; wrong) but accepts several malformed Authorization headers, so a 200 from it
; is not evidence the header grammar is right.
[auth-md5]
type=auth
auth_type=userpass
username=impi-user
password=shared-pw
realm=cellrift.interop
supported_algorithms_uas=MD5

[auth-sha256]
type=auth
auth_type=userpass
username=impi-user
password=shared-pw
realm=cellrift.interop
supported_algorithms_uas=SHA-256

[auth-both]
type=auth
auth_type=userpass
username=impi-user
password=shared-pw
realm=cellrift.interop
supported_algorithms_uas=SHA-256,MD5

[447700900201](endpoint-tmpl)
aors=447700900201
auth=auth-md5

[447700900201](aor-tmpl)

[447700900202](endpoint-tmpl)
aors=447700900202
auth=auth-sha256

[447700900202](aor-tmpl)

[447700900203](endpoint-tmpl)
aors=447700900203
auth=auth-both

[447700900203](aor-tmpl)
