; extensions.conf — the minimum dialplan that answers basic_call.yaml, mounted
; read-only over the image's sample.
;
; The context name matches pjsip.conf's endpoint-tmpl context=from-cellrift.
; The extension is the To user of the INVITE (447700900002); Asterisk selects
; the context from the CALLING endpoint, so the callee needs no endpoint of
; its own.
;
; Ringing() emits 180 Ringing, not 183 Session Progress. The Wait(1) between
; Ringing() and Answer() is load-bearing: it makes the 180-before-200 ordering
; deterministic on the wire, which is what basic_call.yaml's flow describes.
; One second is well inside the step timeout the harness passes (5000 ms).
;
; Wait(30) after Answer() keeps the call up long enough for the BYE to arrive.
;
; SYNTHETIC DATA: Ofcom test range (447700900xxx) only.

[from-cellrift]
exten => 447700900002,1,NoOp(cellrift call)
 same => n,Ringing()
 same => n,Wait(1)
 same => n,Answer()
 same => n,Wait(30)
 same => n,Hangup()
