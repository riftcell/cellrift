; pjsip-reject.conf — the rejecting-peer probe configuration.
;
; Identical transports to pjsip.conf and NO endpoints at all. Asterisk answers
; a REGISTER whose From user matches no endpoint with 401 Unauthorized, so
; every scenario run against this configuration fails at its first step. A job
; that has only ever passed has not been shown to be a gate; booting this
; config is how the gate is shown to fire.
;
; Selected with: PJSIP_CONF=test/interop/asterisk/pjsip-reject.conf \
;                EXPECT_ENDPOINTS=0 bash test/interop/up-sip.sh

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:15060

[transport-tls]
type=transport
protocol=tls
bind=0.0.0.0:15061
cert_file=/etc/asterisk/keys/asterisk.crt
priv_key_file=/etc/asterisk/keys/asterisk.key
method=tlsv1_2
