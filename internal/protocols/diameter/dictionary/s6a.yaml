  # file's own header already describes for other AVPs, so it sits outside
  # Table 7.3.1/1's own 1400-1493 transcribed range. This codebase's
  # scenarios use the value EUTRAN (1004).
  - name: RAT-Type
    code: 1032
    vendor-id: 10415
    type: Enumerated
    flags: { mandatory: true, vendor: true }

