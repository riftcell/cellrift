    type: Grouped
    flags: { mandatory: true, vendor: true }
    members:
      - { name: Mandatory-Capability, required: false, max: 0 }
      - { name: Optional-Capability, required: false, max: 0 }
      - { name: Server-Name, required: false, max: 0 }

  # 3GPP TS 29.229 §6.3.5
